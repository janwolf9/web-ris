sonar.projectKey=janwolf9_web-ris
sonar.organization=janwolf9

# Project metadata
sonar.projectName=web-ris
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/coverage/**,**/public/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/index.tsx,**/reportWebVitals.ts,**/setupTests.ts

# TypeScript/JavaScript specific settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test execution reports (optional)
sonar.testExecutionReportPaths=test-report.xml

# Encoding
sonar.sourceEncoding=UTF-8
